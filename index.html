<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Junhao Tan — Peking University. Personal homepage and contact information.">
  <meta name="author" content="Junhao Tan">
  <meta name="theme-color" content="#7f2637">
  <meta property="og:title" content="Junhao Tan | Peking University">
  <meta property="og:description" content="Personal homepage of Junhao Tan, Peking University.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tan20042023.github.io/">
  <link rel="canonical" href="https://tan20042023.github.io/">
  <title>Junhao Tan | Peking University</title>
  <style>
    :root { color-scheme: light; --paper: #fcfaf7; --ink: #262626; --muted: #66615e; --accent: #7f2637; --line: #e0d9d2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; line-height: 1.6; }
    body::before { content: ""; display: block; height: 5px; background: var(--accent); }
    .page { max-width: 900px; margin: 0 auto; padding: 54px 48px 28px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; font-size: 13px; }
    .eyebrow { margin: 0; color: var(--muted); letter-spacing: .13em; text-transform: uppercase; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 2px; }
    .nav-link { text-decoration: none; }
    .nav-link:hover { text-decoration: underline; }
    .intro { padding: 94px 0 61px; }
    h1 { margin: 0 0 14px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(46px, 7vw, 72px); line-height: 1.12; font-weight: 400; letter-spacing: -.035em; }
    .affiliation { margin: 0; font-size: 22px; color: var(--muted); }
    .affiliation a { color: inherit; text-decoration: none; }
    .affiliation a:hover { color: var(--accent); text-decoration: underline; }
    .contact { border-top: 1px solid var(--line); padding: 34px 0 52px; display: grid; grid-template-columns: 160px 1fr; gap: 28px; }
    h2 { margin: 3px 0 0; font-size: 14px; line-height: 1.6; font-weight: 600; }
    dl { margin: 0; }
    .contact-row + .contact-row { margin-top: 23px; }
    dt { margin-bottom: 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
    dd { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
    footer { border-top: 1px solid var(--line); padding-top: 20px; font-size: 12px; color: var(--muted); }
    @media (max-width: 600px) {
      .page { padding: 28px 24px 24px; }
      .masthead { font-size: 11px; gap: 16px; }
      .intro { padding: 68px 0 42px; }
      .affiliation { font-size: 20px; }
      .contact { grid-template-columns: 1fr; gap: 20px; padding: 27px 0 36px; }
      dd { font-size: 16px; }
    }
    @media print {
      body { background: white; }
      .page { padding: 20px; }
      .intro { padding-top: 50px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="eyebrow">Personal homepage</p>
      <a class="nav-link" href="https://github.com/Tan20042023">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <section class="intro" aria-labelledby="name">
        <h1 id="name">Junhao Tan</h1>
        <p class="affiliation"><a href="https://www.pku.edu.cn/">Peking University</a></p>
      </section>
      <section class="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <dl>
          <div class="contact-row">
            <dt>University email</dt>
            <dd><a href="mailto:2601213035@stu.pku.edu.cn">2601213035@stu.pku.edu.cn</a></dd>
          </div>
          <div class="contact-row">
            <dt>Personal email</dt>
            <dd><a href="mailto:tjh20042024@gmail.com">tjh20042024@gmail.com</a></dd>
          </div>
        </dl>
      </section>
    </main>
    <footer>© 2026 Junhao Tan</footer>
  </div>
</body>
</html>
